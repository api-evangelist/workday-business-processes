tags:
- name: Types
  description: Returns all business process types. Secured by Public Business Processes.
paths:
  /types:
    get:
      tags:
      - Types
      summary: Retrieves all business process types
      description: 'Retrieves a collection of business process types.


        Secured By Domain: Public Business Processes


        Scope: Tenant Non-Configurable'
      parameters:
      - name: limit
        in: query
        description: The maximum number of objects in a single response. The default is 20. The maximum is 100.
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: 'The zero-based index of the first object in a response collection. The default is 0. Use offset with the limit parameter to control paging of a response collection. Example: If limit is 5 and offset is 9, the response returns a collection of 5 objects starting with the 10th object.'
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful response. A successful response can return no matched data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    format: int32
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/businessProcessTypeView_a06e49cf714e100008435914d7d90105'
        '400':
          description: Invalid request. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
        '401':
          description: 'Unauthorized: Missing or invalid credentials. (https://community.workday.com/rest/error-messages)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
        '403':
          description: User has insufficient permissions. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
        '404':
          description: Resource not found. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERROR_MODEL_REFERENCE'
      x-workday-internal-try-enabled: 'false'
      x-workday-operation-id: a06e49cf714e100007fd676f0d2c0101
      x-workday-secured-by-domains:
      - Public Business Processes
      operationId: getTypes
      x-operation-id-source: derived
    post:
      tags:
      - Types
      description: Creates a new custom business process type, including initiating actions.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createCustomBusinessProcessTypeDetail'
      responses:
        '200':
          description: Creates a new custom business process type instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customBusinessProcessTypeDetail'
        '400':
          description: 'Possible Validations:


            - The name for custom business process type is required and must be unique across all custom business process types.


            - The name for initiating actions is required and must be unique within a custom business process type.


            - The referenceIdValue must be unique across all custom business process types.


            - The referenceIdValue for initiatingActions must be unique across all initiating actions.


            - Custom object is not valid for target business object.


            - You are not allowed to set more than one initiating allowed action as default.


            - The Custom Task cannot be used by more than one initiating allowed action.


            - The Event Task Definition is required for the Event Action Task Configuration


            - The Event Action is required for the Event Action Task Configuration

            '
      security:
      - oAuth2:
        - write
        - read
      summary: Create
      x-summary-source: derived
    servers:
    - url: https://{tenantHostname}/businessProcess/v1
      description: Workday tenant REST API host (API Gateway)
      variables:
        tenantHostname:
          default: wd2-impl-services1.workday.com
          description: Your Workday tenant API hostname, e.g. wd2-impl-services1.workday.com
  /types/{ID}:
    get:
      tags:
      - Types
      summary: Retrieves a business process type
      description: 'Retrieves the business process type specified by the ID.


        Secured By Domain: Public Business Processes


        Scope: Tenant Non-Configurable'
      parameters:
      - name: ID
        in: path
        description: 'The Workday ID of the resource.


          Accepts:

          - **Workday ID**: Workday ID (32-character lowercase hexadecimal string).

          - **Reference ID**: Workday reference ID (Type=Value). Valid types: Business_Process_Type'
        required: true
        schema:
          $ref: '#/components/schemas/ResourceIdPathValue_types'
        examples:
          wid:
            summary: Specific resource WID
            value: a3f5b554007d20e98360015c5e6daf6
          referenceId:
            summary: Reference ID
            value: Business_Process_Type=21002
      responses:
