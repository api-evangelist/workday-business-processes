openapi: 3.2.0
info:
  title: Changelog for businessProcess 04/24/2023 API
  description: The public APIs to access event actions and details
  version: v1
servers:
- url: https://<tenantHostname>/businessProcess/v1
tags:
- name: 04/24/2023
  description: Changes for v2023.16
paths:
  2023.16/eventSteps/{ID}/questionnaire:
    post:
      tags:
      - 04/24/2023
      summary: Added new operation
      description: 'Post an action for a Complete Questionnaire step in a business process.

        Specify these required fields in the request body if the intended action is Submit or Save for Later: {stepAction, questionnaireResponse}.

        You can send Save for Later multiple times, but {questionnaireResponse} values will replace the existing questionnaire answers.

        If the intended action is Skip, exclude {questionnaireResponse} from the request body.


        Valid values for stepAction are:

        { "id": "133d5c88baa64136aab041c1d2e9ed53" } for Submit,

        { "id": "d9e41a8c446c11de98360015c5e6daf6" } for Save for Later,

        { "id": "d9e4231a446c11de98360015c5e6daf6" } for Skip.


        Secured by: Core Navigation, Public Business Processes


        Scope: Adaptive Planning for Financial Plans, Adaptive Planning for the Workforce, Tenant Non-Configurable


        View this Endpoint: POST /eventSteps/{ID}/questionnaire'
      parameters:
      - name: ID
        in: path
        description: The Workday ID of the resource.
        required: true
        explode: false
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/completeQuestionnaireEventStep_3544fcea2784100018ee4286aeca0000'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '201':
          description: Resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/completeQuestionnaireEventStep_3544fcea2784100018ee4286aeca0000'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: 'Invalid request. (https://community.workday.com/rest/error-messages)

            Error Code | Validation Message

            --- | ---

            A212 | This event step isn''t awaiting your action

            A1584 | Specify a questionnaire response.

            A1585 | Specify a complete questionnaire.

            A1649 | You can’t skip this step if you provide a questionnaire response.

            A1650 | Specify Submit, Save for Later or Skip. This step type doesn''t support other actions.

            A1651 | This step is required.

            - | All answered questions must be questions from the associated questionnaire.

            - | All answers you submit must match the expected format for that question type.

            - | This questionnaire has already been skipped. You can’t submit it again.

            - | This questionnaire is now closed. You can no longer submit new responses or change your existing responses.

            - | This questionnaire was submitted already. You can’t submit it again.

            - | This questionnaire was submitted already. You can’t submit it again.

            - | You cannot submit answers to branching questions without answers for parent questions.

            - | You have selected an invalid answer choice.

            - | You have submitted more multiple choice answers than is allowed for a question.

            - | You have submitted more than one answer for a single select multiple choice question.

            - | You must answer all required questions.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Invalid resource or operation. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '403':
          description: User has insufficient permissions. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '404':
          description: Resource not found. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
      extensions:
        x-workday-try-enabled: 'false'
        x-codegen-request-body-name: completeQuestionnaireEventStep
      operationId: post202316EventStepsByIDQuestionnaire
      x-operation-id-source: derived
