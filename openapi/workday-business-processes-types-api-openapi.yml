      description: 'Retrieves all attachment categories for the specified business process type that the processing user can select for the specified event. You can filter by event target.


        Secured By Domain: Core Navigation, Public Business Processes


        Scope: Adaptive Planning for Financial Plans, Adaptive Planning for the Workforce, Benefits, Tenant Non-Configurable'
      parameters:
