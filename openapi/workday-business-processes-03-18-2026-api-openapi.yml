paths:
  2026.11/eventSteps/{ID}/reassign:
    post:
      tags:
      - 03/18/2026
      summary: Added new operation
      description: 'Reassigns the business process event step specified by the reference ID of the originating event step.


        Secured by: Core Navigation, Public Business Processes


        Scope: Adaptive Planning for Financial Plans, Adaptive Planning for the Workforce, Benefits, Tenant Non-Configurable


        View this Endpoint: POST /eventSteps/{ID}/reassign'
      parameters:
      - name: ID
        in: path
        description: The Workday ID of the resource.
        required: true
        style: SIMPLE
        explode: false
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/businessProcessStepsReassign_bd578ca9ac8010001895bda38db00000'
              exampleSetFlag: false
            exampleSetFlag: false
      responses:
        '201':
          description: Resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/businessProcessStepsReassign_bd578ca9ac8010001895bda38db00000'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: 'Invalid request. (https://community.workday.com/rest/error-messages)

            Error Code | Validation Message

            --- | ---

            A2822 | Specify a comment.

            A3055 | You can''t remove and add the same person to the business process step. Specify a different person for the reassignment.

            A3056 | Specify at least 1 person to remove or 1 person to add to the business process step.

            A3057 | Specify a valid person to remove from the business process step. You can''t remove a person that''s not a current awaiting person for the step.

            A3058 | There must be at least 1 awaiting person.

            A3059 | Specify a valid person. You can''t reassign the business process step to the current awaiting person.

            A3152 | You don''t have security permissions to perform this reassignment.

            A3153 | You can''t reassign the event because the event record has a Completed status.

            A3154 | You can''t reassign the event.

            A3173 | The role you''re attempting to reassign to is blocked by routing restrictions.

            A3174 | You can''t assign the business process step to a person that doesn''t have an active Workday account.

            A3175 | Specify a valid role to reassign the business process step to. The person''s role isn''t configured or isn''t part of a security group on the business process security policy to perform the action.

            A3185 | Specify a valid step type. Reassignment doesn''t support this step type.

            A3186 | You can''t reassign this business process step.

            A3187 | You can’t reassign the event because eSignature isn’t supported in reassignment.'
          content: {}
        '401':
          description: 'Unauthorized: Missing or invalid credentials. (https://community.workday.com/rest/error-messages)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '403':
          description: User has insufficient permissions. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '404':
          description: Resource not found. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
