event_surface:
  webhooks: false
  asyncapi: false
  note: >-
    No outbound webhook contract and no AsyncAPI for business process events. Workday's nearest
    equivalents are internal: Orchestrate can "Launch Orchestrations on Business Process Status Changes"
    and the SOAP Integrations service carries Put_Subscription / Get_Subscriptions for transaction-log
    integration subscriptions. Neither is a published event contract a third party can subscribe to, so
    no AsyncAPI or Webhooks pointer is emitted. The two doc.workday.com "Workday Webhooks" pointers
    previously in apis.yml returned HTTP 404 and were removed.
