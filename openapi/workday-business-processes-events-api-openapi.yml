  variables:
    tenantHostname:
      default: wd2-impl-services1.workday.com
      description: Your Workday tenant API hostname, e.g. wd2-impl-services1.workday.com
tags:
- name: Events
  description: 'Returns a collection of events based on the specified parameters. You must specify either the worker or initiating worker query parameter. If you did not specify the worker nor the initiating worker parameter, this method returns an empty response.


    This operation returns the most recent results first. The results are sorted in descending order of the creation date of the event.


    Secured by the Business Process Security Policy for each event.'
  x-workday-confidence-level: Production
