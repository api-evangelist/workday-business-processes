  /types/{id}:
    get:
      tags:
      - Types
      description: Returns a custom business process type
      operationId: view
      parameters:
      - name: id
        in: path
        description: The Workday Id of the custom business process type
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns a custom business process type for the Id supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customBusinessProcessTypeDetail'
        '404':
          description: Not Found.
      security:
      - oAuth2:
        - write
        - read
      summary: View
      x-summary-source: derived
    put:
      tags:
      - Types
      description: Updates a custom business process type
      operationId: update
      parameters:
      - name: id
        in: path
        description: The Workday Id of the custom business process type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/editCustomBusinessProcessTypeDetail'
        description: Custom business process type data to be updated.
        required: true
      responses:
        '200':
          description: Updates a custom business process type for the Id supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customBusinessProcessTypeDetail'
        '400':
          description: 'Possible Validations:


            -The referenceIdValue must be unique across all custom business process types.


            -The name for custom business process type must be unique across all custom business process types.


            -Custom object is not valid for target business object.


            -Changes to the custom object are not allowed once an event exists for this custom business process.


            -Changes to the business object are not allowed once an event exists for this custom business process.


            -Changes to the Name are not allowed once an event exists for this custom business process.


            -Changes to the ID are not allowed once an event exists for this custom business process.

            '
      security:
      - oAuth2:
        - write
        - read
      summary: Update
      x-summary-source: derived
    delete:
      tags:
      - Types
      description: Deletes a custom business process type
      operationId: delete
      parameters:
      - name: id
        in: path
        description: The Workday Id of the custom business process type
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deletes a custom business process type for the Id supplied
        '400':
          description: 'Possible Validations:

            - The custom business process type cannot be deleted because it has references.

            - You cannot delete a custom business process type that has been used by a business process event.'
        '404':
          description: Not Found.
      security:
      - oAuth2:
        - write
        - read
      summary: Delete
      x-summary-source: derived
