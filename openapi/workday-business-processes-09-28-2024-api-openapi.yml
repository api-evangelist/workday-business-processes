paths:
  2024.39/events/{ID}/cancel:
    post:
      tags:
      - 09/28/2024
      summary: Added new operation
      description: 'Cancels the business process event specified by the ID. In the request body, specify these required fields: comment.


        Secured by: Core Navigation, Public Business Processes


        Scope: Adaptive Planning for Financial Plans, Adaptive Planning for the Workforce, Tenant Non-Configurable


        View this Endpoint: POST /events/{ID}/cancel'
      parameters:
      - name: ID
        in: path
        description: The Workday ID of the resource.
        required: true
        explode: false
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/businessProcessEventAction_46302b0ce6a810001fcbad0bc1e30000'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '201':
          description: Resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/businessProcessEventAction_46302b0ce6a810001fcbad0bc1e30000'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: 'Invalid request. (https://community.workday.com/rest/error-messages)

            Error Code | Validation Message

            --- | ---

            A181 | You need to specify a comment.

            A219 | You can''t cancel this business process because the event isn''t in progress or in error.

            A2198 | You can''t cancel this event because this action isn''t supported on the subprocess.

            A2199 | You can''t cancel this event because this action isn''t supported on the business process.

            A2200 | You can''t cancel this event because this action isn''t currently supported on the business process.

            A2201 | You currently don''t have security access to cancel this event.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Invalid resource or operation. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '403':
          description: User has insufficient permissions. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '404':
          description: Resource not found. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
