docs_note: Workday REST authorization is TWO-LAYERED and neither layer alone is enough. (1) OAuth scopes are selected when an API
  client is registered in the Developer Site Console; Workday calls them "scopes" but they are FUNCTIONAL AREAS, not the fine-grained
  read:x/write:x scopes most APIs publish, and the scope a given endpoint needs is stated in the endpoint description in the REST
  API Explorer rather than in a scopes reference page. (2) The tenant business process security policy still governs whether the
  authenticated security group may take the action. An agent holding a valid token can still be refused by policy.
