- name: 04/02/2022
  description: Changes for v2022.14
paths:
  2022.14/eventSteps/{ID}/submit:
    post:
      tags:
      - 04/02/2022
      summary: Added new operation
      description: 'Submits the business process event step specified by the ID of the originating event step. In the request body, specify these required fields: id (the event step you are submitting), stepAction {id} (if there are multiple event steps), comment.


        Secured by: Core Navigation


        Scope: Adaptive Planning for the Workforce, Adaptive Planning for Financial Plans


        View this Endpoint: POST /eventSteps/{ID}/submit'
      parameters:
      - name: ID
        in: path
        description: The Workday ID of the resource.
        required: true
        explode: false
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/businessProcessEventStepSubmit_9df63b314485100006ff40401d3e00f0'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '201':
          description: Resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/businessProcessEventStepSubmit_9df63b314485100006ff40401d3e00f0'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: 'Invalid request. (https://community.workday.com/rest/error-messages)

            Error Code | Validation Message

            --- | ---

            A226 | Event must be an application business process event

            A212 | This event step isn''t awaiting your action

            A169 | This step isn''t valid for submission'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Invalid resource or operation. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '403':
          description: User has insufficient permissions. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '404':
          description: Resource not found. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
