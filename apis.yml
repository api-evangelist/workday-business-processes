aid: workday-business-processes
name: Workday Business Processes
description: 'Workday Business Processes is the workflow engine at the centre of Workday HCM and Financial Management: every
  hire, job change, expense report, requisition and payment runs as a business process event routed through configured approval,
  to-do and questionnaire steps. Workday exposes it as a first-party REST service, businessProcess v1, which reads business
  process types, events and event steps and performs the real actions on them — approve, deny, send back, reassign, cancel
  and rescind — alongside a Custom Business Process Config v1 service for authoring custom process types and event task definitions,
  business-process operations inside the Integrations SOAP service, and business process query fields in the Workday Graph
  API.'
