notes: The published specs declare only an implicit flow, which is NOT what Workday tells integrators to use. The docs document
  Authorization Code and Client Credentials as the supported flows for a registered API client, plus refresh-token renewal. Registration
  is per tenant in the Developer Site Console and a client must be separately allowlisted onto each non-development tenant by a
  Company Administrator. The SOAP side (wsdl/) authenticates differently again — WS-Security UsernameToken or X.509, with an Integration
  System User, not OAuth. There is no OIDC discovery document and no RFC 8414 metadata on any Workday host (84 well-known probes
  on 2026-09-17, all 404), so a client cannot discover the endpoints programmatically; they are tenant-specific and read from the
  docs or the Console.
