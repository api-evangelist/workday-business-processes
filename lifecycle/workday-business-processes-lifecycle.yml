  public: false
  access: customer-login-required
  verified: '2026-09-17'
  evidence: >-
    HTTP 200, but the body is an Okta sign-in widget titled "Workday Resource Center - Sign In";
    https://status.workday.com/api/v2/status.json returns the same sign-in page rather than a Statuspage
    JSON payload. Workday's service status is real but is gated to authenticated customers — there is no
    anonymous status surface.
