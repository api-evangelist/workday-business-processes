versioning:
  scheme: uri-path
  current: v1
  rest_pattern: https://{tenantHostname}/{service}/{version}
  soap_pattern: https://{workdayDomain}/ccx/service/{tenant}/{service}/{version}
  soap_current: v47.0
  docs: https://developer.workday.com/doc/owp1552934548258.md
  note: >-
    Workday versions each REST service independently — businessProcess is still v1 while staffing is v7
    and person is v4. SOAP versions move together with the release train (v47.0 current, v40.1 the oldest
    still listed in the SOAP catalog). SOAP additionally supports MESSAGE versioning: a version inside the
    request body overrides the version in the endpoint.
confidence_level:
  value: Production
  source: services_oas3.json productionConfidenceLevel[]
  note: >-
    Workday publishes a per-service confidence level — Production, Preview, Experimental, Archived.
    businessProcess v1 is Production. This is a real, machine-readable lifecycle signal most providers
    do not publish at all.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  archived_versions_published: true
  archived_versions_url: https://developer.workday.com/bundles/rest-directory-ui/public/static/services_oas3.json
  note: >-
    Workday publishes an explicit archivedServices[] list in the REST directory index — 44 archived
    service versions across the estate (staffing v1-v6, person v1-v3, procurement v1-v4, and so on).
    businessProcess has NO archived version: v1 is the only version that has ever shipped. But there is
    no written deprecation POLICY and no RFC 8594 Sunset/Deprecation header support: probed the live
    spec and docs on 2026-09-17 and found neither. The archive list is the closest thing to a
    deprecation signal Workday publishes.
