      parameters:
      - name: businessProcess
        in: query
        description: "<b>Parameter Description changed</b>  \n| Updated Value |  \n| :--- |  \n| None |  \n\n| Previous Value |  \n| :--- |  \n| The business process type associated with the business process. Returns filterable search results. Use with the Business Process Type data source. |  \n\n"
        required: false
        style: FORM
        explode: true
        schema:
          type: array
          exampleSetFlag: false
          items:
            type: string
            exampleSetFlag: false
            types:
            - string
          types:
          - array
      - name: completedOnOrAfter
