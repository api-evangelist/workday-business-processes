        '400':
          description: "Invalid request. (https://community.workday.com/rest/error-messages)\n| Severity | Error Code | Validation Message |\n --- | --- | --- |\n| Critical | A212 | This event step isn't awaiting your action |\n| Critical | A1584 | Specify a questionnaire response. |\n| Critical | A1585 | Specify a complete questionnaire. |\n| Critical | A1649 | You can’t skip this step if you provide a questionnaire response. |\n| Critical | A1650 | Specify Submit, Save for Later or Skip. This step type doesn't support other actions. |\n| Critical | A1651 | This step is required. |\n| Critical | A1754 | You have submitted more than one answer for a single select multiple choice question. |\n| Critical | A1755 | You have selected an invalid answer choice. |\n| Critical | A1757 | This questionnaire is now closed. You can no longer submit new responses or change your existing responses. |\n| Critical | A1758 | You cannot submit answers to branching questions without answers for parent questions. |\n| Critical | A1759 | All answers you submit must match the expected format for that question type. |\n| Critical | A1760 | This questionnaire was submitted already. You can’t submit it again. |\n| Critical | A1761 | All answered questions must be questions from the associated questionnaire. |\n| Critical | A1762 | Attach an answer. There's no uploaded file. |\n| Critical | A1763 | This questionnaire has already been skipped. You can’t submit it again. |\n| Critical | A1764 | You must answer all required questions. |\n| Critical | A1765 | You have submitted more multiple choice answers than is allowed for a question. |"
