source: >-
  https://github.com/Workday + registry.npmjs.org + pypi.org — searched npm, PyPI, Maven Central,
  NuGet, pkg.go.dev, RubyGems, Packagist and crates.io for a first-party client library for the
  Workday Business Process REST API (developer.workday.com /businessProcess/v1).
summary: >-
  Workday publishes first-party packages, but NONE of them wraps the Business Process REST API.
  The @workday/* npm scope is the Canvas design system (UI components, see components/); the
  first-party API clients on github.com/Workday cover Prism Analytics and Reports-as-a-Service
  only, and neither is published to PyPI. Consumers of /businessProcess/v1 call the REST endpoints
  directly (or the Integrations SOAP service, see wsdl/). Third-party packages named "workday" on
  npm and PyPI are NOT Workday-authored and are recorded below as such so they are not mistaken
  for official SDKs.
