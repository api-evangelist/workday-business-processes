paths:
  2021.37/events/{ID}/comments:
    get:
      tags:
      - 09/01/2021
      summary: Added new operation
      description: 'Retrieves comments on the specified business process event.


        Secured by: Core Navigation


        Scope: Adaptive Planning for the Workforce, Adaptive Planning for Financial Plans


        View this Endpoint: GET /events/{ID}/comments'
      parameters:
      - name: ID
        in: path
        description: The Workday ID of the resource.
        required: true
        explode: false
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      - name: limit
        in: query
        description: The maximum number of objects in a single response. The default is 20. The maximum is 100.
        required: false
        explode: true
        schema:
          type: integer
          format: int64
          exampleSetFlag: false
          types:
          - integer
      - name: offset
        in: query
        description: 'The zero-based index of the first object in a response collection. The default is 0. Use offset with the limit parameter to control paging of a response collection. Example: If limit is 5 and offset is 9, the response returns a collection of 5 objects starting with the 10th object.'
        required: false
        explode: true
        schema:
          type: integer
          format: int64
          exampleSetFlag: false
          types:
          - integer
      responses:
        '200':
          description: Successful response. A successful response can return no matched data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    exampleSetFlag: false
                    items:
                      $ref: '#/components/schemas/comments_a7a41b4d029c10000b1da9c45b7b18f4'
                      exampleSetFlag: false
                    types:
                    - array
                  total:
                    type: integer
                    format: int64
                    exampleSetFlag: false
                    types:
                    - integer
                description: collection something or other
                exampleSetFlag: false
                types:
                - object
              exampleSetFlag: false
        '400':
          description: Invalid request. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Invalid resource or operation. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
        '403':
          description: User has insufficient permissions. (https://community.workday.com/rest/error-messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VALIDATION_ERROR_MODEL_REFERENCE'
                exampleSetFlag: false
              exampleSetFlag: false
