naftiko: 1.0.0-alpha2
info:
  label: Workday Business Process API — Business Process Definitions
  description: 'Workday Business Process API — Business Process Definitions. 2 operations. Lead operation: Workday List Business
    Process Definitions. Self-contained Naftiko capability covering one Workday Business Processes business surface.'
  tags:
  - Workday Business Processes
  - Business Process Definitions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WORKDAY_BUSINESS_PROCESSES_API_KEY: WORKDAY_BUSINESS_PROCESSES_API_KEY
capability:
  consumes:
  - type: http
    namespace: workday-business-processes-business-process-definitions
    baseUri: https://{tenant}.workday.com/api/businessProcess/v1
    description: Workday Business Process API — Business Process Definitions business capability. Self-contained, no shared
      references.
    resources:
    - name: businessProcessDefinitions
      path: /businessProcessDefinitions
      operations:
      - name: listbusinessprocessdefinitions
        method: GET
        description: Workday List Business Process Definitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of records to return
        - name: offset
          in: query
          type: integer
          description: Number of records to skip
        - name: processType
          in: query
          type: string
          description: Filter by business process type
    - name: businessProcessDefinitions-definitionId
      path: /businessProcessDefinitions/{definitionId}
      operations:
      - name: getbusinessprocessdefinition
        method: GET
        description: Workday Get Business Process Definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: definitionId
          in: path
          type: string
          description: Business process definition identifier
          required: true
    authentication:
      type: bearer
      token: '{{env.WORKDAY_BUSINESS_PROCESSES_API_KEY}}'
  exposes:
  - type: rest
    namespace: workday-business-processes-business-process-definitions-rest
    port: 8080
    description: REST adapter for Workday Business Process API — Business Process Definitions. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/businessprocessdefinitions
      name: businessprocessdefinitions
      description: REST surface for businessProcessDefinitions.
      operations:
      - method: GET
        name: listbusinessprocessdefinitions
        description: Workday List Business Process Definitions
        call: workday-business-processes-business-process-definitions.listbusinessprocessdefinitions
        with:
          limit: rest.limit
          offset: rest.offset
          processType: rest.processType
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/businessprocessdefinitions/{definitionid}
      name: businessprocessdefinitions-definitionid
      description: REST surface for businessProcessDefinitions-definitionId.
      operations:
      - method: GET
        name: getbusinessprocessdefinition
        description: Workday Get Business Process Definition
        call: workday-business-processes-business-process-definitions.getbusinessprocessdefinition
        with:
          definitionId: rest.definitionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: workday-business-processes-business-process-definitions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Workday Business Process API — Business Process Definitions. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: workday-list-business-process-definitions
      description: Workday List Business Process Definitions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workday-business-processes-business-process-definitions.listbusinessprocessdefinitions
      with:
        limit: tools.limit
        offset: tools.offset
        processType: tools.processType
      outputParameters:
      - type: object
        mapping: $.
    - name: workday-get-business-process-definition
      description: Workday Get Business Process Definition
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workday-business-processes-business-process-definitions.getbusinessprocessdefinition
      with:
        definitionId: tools.definitionId
      outputParameters:
      - type: object
        mapping: $.
