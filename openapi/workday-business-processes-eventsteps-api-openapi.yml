      - eventSteps
      summary: Retrieves business process event steps
      description: 'Retrieves a collection of business process event steps. You can filter the event steps by business process, creation date, due date, and step type. Returned results are secured based on processing person''s view access to the events to which the steps belong. Only event steps from events the processing person has view access to will be included in the collection.


        Secured By Domain: Core Navigation, Public Business Processes


        Scope: Adaptive Planning for Financial Plans, Adaptive Planning for the Workforce, Benefits, Tenant Non-Configurable'
      parameters:
      - name: businessProcess
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: createdOnOrAfter
        in: query
        schema:
          type: string
          format: date
      - name: createdOnOrBefore
        in: query
        schema:
          type: string
          format: date
      - name: dueDateOnOrAfter
        in: query
        schema:
          type: string
          format: date
      - name: dueDateOnOrBefore
        in: query
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: The maximum number of objects in a single response. The default is 20. The maximum is 100.
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: 'The zero-based index of the first object in a response collection. The default is 0. Use offset with the limit parameter to control paging of a response collection. Example: If limit is 5 and offset is 9, the response returns a collection of 5 objects starting with the 10th object.'
        schema:
          type: integer
          format: int64
      - name: stepType
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successful response. A successful response can return no matched data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    format: int32
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/eventStepsSummary_da856647269810000f8afbac30ba0183'
        '400':
