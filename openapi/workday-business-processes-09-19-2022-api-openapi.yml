        in: query
        description: "<b>Parameter Description changed</b>  \n| Updated Value |  \n| :--- |  \n| None |  \n\n| Previous Value |  \n| :--- |  \n| The date and time this business process was initiated. |  \n\n"
        required: false
        explode: true
        schema:
          type: string
          format: date
          exampleSetFlag: false
          types:
          - string
      - name: initiator
        in: query
        description: "<b>Parameter Description changed</b>  \n| Updated Value |  \n| :--- |  \n| None |  \n\n| Previous Value |  \n| :--- |  \n| The \\~worker\\~ that initiated the business process. Please do not use this field in a condition rule for the initiation step of a process, as it will not return results. This is because there is no initiating \\~worker\\~ designated until the process has started. The Initiating \\~Worker\\~ field only gets a value after the event is initiated (after the process is submitted). |  \n\n"
