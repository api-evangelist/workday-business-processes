description: >-
  Workday publishes no pricing for the Business Process API, and none for Workday itself. There is no
  public price list, no per-call rate card, and no self-serve signup that yields a billable tenant.
  https://www.workday.com/en-us/pricing.html returns HTTP 404; every route to commercial terms goes
  through a sales contact form (forms.workday.com/en-us/sales/sales-contact/form.html).
findings:
  - The API is not separately licensed. Access to /businessProcess/v1 comes with a Workday tenant; there
    is no API SKU, no metered call pricing, and no overage schedule.
  - Commercial terms are contractual. The Universal Contract Terms and Conditions
    (https://www.workday.com/en-us/legal/universal-contract-terms-and-conditions/index.html, HTTP 200)
    are the published document, and they carry terms, not prices.
  - Service limits are published in place of quotas — see rate-limits/. Workday scales extract-request
    ceilings by customer worker count, which is the closest thing to a published tier structure, and it
    is a limit ladder rather than a price ladder.
  - Developer Site accounts are free to create and give access to the docs, the REST/Graph/SOAP
    explorers and the API specifications; they do not give access to a tenant.
